<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">

<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Hermes-Ride</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#333;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* WP5 (D1): the orb (orb.js). #orb is centred, at most 3/4 of the screen width (and of the height in landscape); the
   ring (#orbl) shows the mic level in listening, the core (#orbc) the state. Design d-simple; state classes s-<state>.
   Only opacity and transform animate (compositor work, no layout or paint per frame); sleep and muted animate nothing.
   Fix G (item 8): the Holodeck blue (holodeck-release-sol renderer): #e8fdff hot core, #a8f7ff rim, #7ff0ff cyan, #2f7c8c
   deep, on black; the low-alpha outer bands of the gradient are the glow (no animated blur).
   P4: the orb moves with the motorcycle. #orbm wraps everything; orb_motion.js's frame is written on it as custom
   properties (--mx --my shift in % of the diameter, --sx --sy squash/stretch, --mk shear, --mr the light's rotation,
   --ma the mount's up axis), at most 20 times a second and never asleep; the 100 ms transitions do the smoothing.
   P4 look (d-simple; with d-plain added it is the flat orb as it was): a halo behind, slow light drifting inside the core (.flow,
   it sloshes at half the body's shift again), and a glass shell (.gyro: sky highlight above, rim light below) that
   turns by --mr so it stays under the real sky when the bike leans. All static paint, moved by transform only. */
#orb{position:fixed;left:50%;top:50%;width:min(75vw,75vh);height:min(75vw,75vh);transform:translate(-50%,-50%);pointer-events:none}
#orbm{position:absolute;inset:0;transform:translate(calc(var(--mx,0)*1%),calc(var(--my,0)*1%)) rotate(calc(var(--ma,0)*1deg)) skewX(calc(var(--mk,0)*1deg)) scale(var(--sx,1),var(--sy,1));transition:transform 100ms linear}
#orb .core,#orb .lvl{position:absolute;inset:0;border-radius:50%;box-sizing:border-box}
.orb .core{opacity:0;transition:opacity .6s ease}
.orb .lvl{opacity:0;transform:scale(.6);transition:opacity .6s ease}
.orb .halo,.orb .flow,.orb .gyro{position:absolute;border-radius:50%;opacity:0;transition:opacity .6s ease}
.orb .halo{inset:-16%;background:radial-gradient(circle,rgba(127,240,255,.2) 0%,rgba(47,124,140,.16) 38%,rgba(47,124,140,.05) 56%,rgba(0,0,0,0) 70%)}
.orb .flow{inset:14%;transform:translate(calc(var(--mx,0)*.7%),calc(var(--my,0)*.7%));transition:opacity .6s ease,transform 160ms linear}
.orb .flow::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 34%,rgba(232,253,255,.5) 0%,rgba(232,253,255,0) 30%),radial-gradient(circle at 70% 60%,rgba(60,150,255,.42) 0%,rgba(60,150,255,0) 34%),radial-gradient(circle at 58% 24%,rgba(127,240,255,.3) 0%,rgba(127,240,255,0) 26%),radial-gradient(circle at 36% 72%,rgba(120,255,230,.26) 0%,rgba(120,255,230,0) 28%)}
.orb .gyro{inset:15%;transform:rotate(calc(var(--mr,0)*1deg));transition:opacity .6s ease,transform 120ms linear;background:radial-gradient(ellipse 40% 22% at 50% 15%,rgba(255,255,255,.85) 0%,rgba(255,255,255,.25) 55%,rgba(255,255,255,0) 100%),radial-gradient(ellipse 60% 30% at 50% 97%,rgba(127,240,255,.5) 0%,rgba(127,240,255,0) 100%);box-shadow:inset 0 0 0 1px rgba(232,253,255,.22),inset 0 -14px 22px -12px rgba(168,247,255,.7),inset 0 16px 26px -16px rgba(255,255,255,.8)}
.d-plain .halo,.d-plain .flow,.d-plain .gyro{display:none}
.orb.d-simple.d-plain .lvl{box-shadow:none}
.d-simple .core{background:radial-gradient(circle,#e8fdff 0%,#a8f7ff 14%,#7ff0ff 30%,rgba(47,124,140,.6) 48%,rgba(47,124,140,.2) 62%,rgba(0,0,0,0) 71%)}
.d-simple.s-listening .core{opacity:1;animation:orb-alive 3.2s ease-in-out infinite}
.d-simple.s-listening .lvl{opacity:1;border:3px solid #a8f7ff;transition:transform 60ms linear}
.d-simple.s-thinking .core{opacity:1;background:radial-gradient(circle,#fff 0%,#e8f2ff 30%,#7fa8ff 52%,rgba(0,0,0,0) 71%);animation:orb-swell 1s ease-out both,orb-breath 4.8s ease-in-out 1s infinite}
.d-simple.s-thinking.beat-a .core{animation:orb-beat-a 4.8s ease-in-out infinite}
.d-simple.s-thinking.beat-b .core{animation:orb-beat-b 4.8s ease-in-out infinite}
.d-simple.s-speaking .core{opacity:1;animation:orb-env 1.7s linear infinite;background:radial-gradient(circle,#ffe8f7 0%,#ffa8e2 14%,#ff80d4 30%,rgba(140,47,101,.6) 48%,rgba(140,47,101,.2) 62%,rgba(0,0,0,0) 71%)}
.d-simple.s-speaking .lvl{opacity:1;border:3px solid #ffa8e2;transition:transform 60ms linear}
.d-simple.s-muted .lvl{opacity:1;border:2px solid #555;transform:scale(.7)}
.d-simple.s-offline .core,.d-simple.s-reconnecting .core,.d-simple.s-connecting .core{opacity:1;background:radial-gradient(circle,#4a2e00 0%,#241600 45%,rgba(0,0,0,0) 71%);animation:orb-pulse 2.4s ease-in-out infinite}
.d-simple.s-listening .lvl{box-shadow:0 0 16px rgba(127,240,255,.5),inset 0 0 16px rgba(127,240,255,.3)}
/* speaking = the listening look with the cyan turned pink at the same HSL lightness (hue 186 -> 325); the blue streak in the cloud stays */
.d-simple.s-speaking .lvl{box-shadow:0 0 16px rgba(255,128,212,.5),inset 0 0 16px rgba(255,128,212,.3)}
.d-simple.s-speaking .halo{background:radial-gradient(circle,rgba(255,128,212,.2) 0%,rgba(140,47,101,.16) 38%,rgba(140,47,101,.05) 56%,rgba(0,0,0,0) 70%)}
.d-simple.s-speaking .flow::before{background:radial-gradient(circle at 30% 34%,rgba(255,232,247,.5) 0%,rgba(255,232,247,0) 30%),radial-gradient(circle at 70% 60%,rgba(60,150,255,.42) 0%,rgba(60,150,255,0) 34%),radial-gradient(circle at 58% 24%,rgba(255,128,212,.3) 0%,rgba(255,128,212,0) 26%),radial-gradient(circle at 36% 72%,rgba(255,120,199,.26) 0%,rgba(255,120,199,0) 28%)}
.d-simple.s-speaking .gyro{background:radial-gradient(ellipse 40% 22% at 50% 15%,rgba(255,255,255,.85) 0%,rgba(255,255,255,.25) 55%,rgba(255,255,255,0) 100%),radial-gradient(ellipse 60% 30% at 50% 97%,rgba(255,128,212,.5) 0%,rgba(255,128,212,0) 100%);box-shadow:inset 0 0 0 1px rgba(255,232,247,.22),inset 0 -14px 22px -12px rgba(255,168,226,.7),inset 0 16px 26px -16px rgba(255,255,255,.8)}
.d-simple.s-listening .halo,.d-simple.s-speaking .halo{opacity:1;animation:orb-halo 6.4s ease-in-out infinite}
.d-simple.s-thinking .halo{opacity:1;animation:orb-halo 4.8s ease-in-out infinite}
.d-simple.s-listening .flow,.d-simple.s-speaking .flow{opacity:1}
.d-simple.s-thinking .flow{opacity:.55}
.d-simple.s-listening .flow::before,.d-simple.s-thinking .flow::before{animation:orb-flow 18s linear infinite}
.d-simple.s-speaking .flow::before{animation:orb-flow 7s linear infinite}
.d-simple.s-listening .gyro,.d-simple.s-speaking .gyro,.d-simple.s-thinking .gyro{opacity:1}
.d-simple.s-offline .gyro,.d-simple.s-reconnecting .gyro,.d-simple.s-connecting .gyro{opacity:.16}
@keyframes orb-alive{0%,100%{transform:scale(.9)}50%{transform:scale(.96)}}
@keyframes orb-swell{0%{opacity:.2;transform:scale(.7)}55%{opacity:1;transform:scale(1)}100%{opacity:.55;transform:scale(.86)}}
@keyframes orb-breath{0%,100%{opacity:.55;transform:scale(.86)}50%{opacity:.35;transform:scale(.8)}}
@keyframes orb-beat-a{0%{opacity:.4;transform:scale(.8)}20%{opacity:.85;transform:scale(.92)}100%{opacity:.4;transform:scale(.8)}}
@keyframes orb-beat-b{0%{opacity:.4;transform:scale(.8)}20%{opacity:.85;transform:scale(.92)}100%{opacity:.4;transform:scale(.8)}}
@keyframes orb-env{0%,100%{transform:scale(.84)}13%{transform:scale(.92)}27%{transform:scale(.87)}41%{transform:scale(.97)}58%{transform:scale(.89)}72%{transform:scale(.95)}86%{transform:scale(.86)}}
@keyframes orb-pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes orb-halo{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes orb-flow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#orbm,.orb .flow,.orb .gyro{transform:none}}
/* show_word (debug): the display() word under the orb */
#w{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));text-align:center;font-size:7vw;font-weight:600;letter-spacing:.02em;color:#2a2a2a;pointer-events:none}
#setup{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#000}
button{background:#111;color:#999;border:1px solid #333;border-radius:14px;font-size:24px;padding:26px 30px;width:78vw}
button:disabled{color:#444;border-color:#1a1a1a}
#note{color:#555;font-size:15px;width:78vw;text-align:center;min-height:2.6em}
/* WP7 (D2): the two setup taps are the orb. #b1 and #b2 stay real <button>s (iOS needs a real tap for audio, mic and
   motion), drawn as the running orb's blue core, one at a time in the middle, no instruction text (rider feedback: the pulse
   says "tap me"). Waiting for a tap = a slow blue pulse; disabled (tap 1 running, or not yet tap 2's turn) = dim and
   still. #setup is removed by tap 2, so the pulse never runs while riding (page_orb_test allows .sorb only). */
.sorb{width:min(60vw,60vh);height:min(60vw,60vh);border-radius:50%;border:0;padding:0;background:transparent;position:relative;flex:none}
.sorb[hidden]{display:none}
.sorb .core{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#e8fdff 0%,#a8f7ff 14%,#7ff0ff 30%,rgba(47,124,140,.6) 48%,rgba(47,124,140,.2) 62%,rgba(0,0,0,0) 71%);transition:opacity .3s ease}
.sorb:enabled .core{animation:sorb-pulse 2s ease-in-out infinite}
.sorb:disabled .core{opacity:.35;animation:none}
@keyframes sorb-pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1)}}
/* R3-6: the mic indicator, apart from the state colours: red dot = audio can leave the phone (STT open / gate
   open), grey ring = mic captured for the on-phone wake word only, crossed ring = every mic track stopped (off) or
   muted by the MUTE button (round 3: same cross, class muted) */
#mic{position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;width:16px;height:16px;border-radius:50%;box-sizing:border-box;z-index:3}
#mic.live{background:#e00000;box-shadow:0 0 0 3px #400}
#mic.local{border:2px solid #777}
#mic.off,#mic.muted{border:2px solid #555;background:linear-gradient(45deg,transparent 45%,#555 45%,#555 55%,transparent 55%)}
/* The dot is redundant on the mount; hidden. The classes are still kept up to date (privacy tests). */
#mic{display:none}
/* info lines (engine, mic name, "resetting") go to #diag, never shown; only failures that need an action are on screen */
#diag{display:none}
/* Fix B: the Tap overlay when the mic did not come back by itself (setup's orb, one word beneath) */
#rv{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#000;z-index:5}
#rv[hidden]{display:none}
/* Fix C (item 1): one word under the setup orb, "Tap", until the tap; it fades out then, and back on a failed tap */
#tap,.tapw{font-size:60px;font-weight:600;color:#a8f7ff;letter-spacing:.04em;transition:opacity .6s ease}
#tap.gone{opacity:0}
/* 10 Nov: the one mic control is as big as the reset bar: the two share one size rule (width, height, box).
   Round 3: that control is MUTE / UNMUTE, one tap; muted (class on, text UNMUTE) it is cyan, so the state is seen. */
#resetbar,#mute{box-sizing:content-box;width:88vw;height:72px}
#mute{font-size:19px;font-weight:600;letter-spacing:.04em;padding:0;color:#888;background:#0a0a0a}
#mute.on{color:#a8f7ff;border-color:#a8f7ff}
/* WP6: the status line sits at the top now (the bottom belongs to the reset reveal) */
#status{position:fixed;top:calc(44px + env(safe-area-inset-top));left:5vw;width:90vw;text-align:center;color:#999;font-size:15px;pointer-events:none}
/* WP6 (D5, P6): the reset reveal. A visible grabber (a short grey pill, 44 px of touch height) near the bottom edge, held
   above the iOS home-indicator zone by the safe-area inset + 28 px; an upward drag from it opens the panel: the long red
   bar (hold 3 s: the fill runs while held, release or movement cancels) and the MUTE button. Everything inside #reveal
   carries data-no-dbltap (no tap wake from here). The fill is a CSS transition: no timer, no animation frame. */
#reveal{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column-reverse;align-items:center;gap:16px;z-index:4;-webkit-touch-callout:none}
#reveal[hidden],#rpanel[hidden]{display:none}
#grab{width:160px;height:44px;display:flex;align-items:center;justify-content:center;touch-action:none}
#grab::after{content:'';width:56px;height:5px;border-radius:3px;background:#3a3a3a}
#rpanel{display:flex;flex-direction:column;align-items:center;gap:16px}
#resetbar{position:relative;width:88vw;height:72px;border-radius:14px;background:#2a0505;border:1px solid #6a1010;overflow:hidden;touch-action:none}
#resetfill{position:absolute;inset:0;background:#d01818;transform:scaleX(0);transform-origin:left center}
#resetbar.holding #resetfill{transform:scaleX(1);transition:transform 3s linear}
#resettext{position:relative;display:flex;height:100%;align-items:center;justify-content:center;color:#f0d0d0;font-size:19px;font-weight:600;letter-spacing:.04em;white-space:nowrap;pointer-events:none}
</style></head><body>
<div id="orb" class="orb d-simple s-sleep" aria-hidden="true">
  <div id="orbm">
    <div class="halo"></div>
    <div id="orbl" class="lvl"></div>
    <div id="orbc" class="core"><div class="flow"></div><div class="gyro"></div></div>
  </div>
</div>
<div id="w"></div>
<div id="setup" data-no-dbltap>
  <button id="b1" class="sorb" aria-label="start: mic, audio and motion"><span class="core"></span></button>
  <div id="tap">Tap</div>
  <div id="note"></div>
</div>
<div id="status" role="status"></div>
<div id="rv" data-no-dbltap hidden>
  <button id="rvb" class="sorb" aria-label="tap: the mic again"><span class="core"></span></button>
  <div class="tapw">Tap</div>
</div>
<div id="diag" aria-hidden="true"></div>
<div id="mic" role="img" aria-label="microphone"></div>
<div id="reveal" data-no-dbltap hidden>
  <div id="grab" role="button" aria-label="drag up: reset and mute"></div>
  <div id="rpanel" hidden>
    <div id="resetbar" role="button" aria-label="hold 3 seconds: reset and start a new session"><div id="resetfill"></div><span id="resettext">RESET – NEW SESSION</span></div>
    <button id="mute" aria-pressed="false" hidden>MUTE</button>
  </div>
</div>
<audio id="a" playsinline preload="auto"></audio>
<script src="client_state.js"></script>
<script src="gate.js"></script>
<script src="wake.js"></script>
<script src="stt.js"></script>
<script src="telemetry.js"></script>
<script src="gesture.js"></script>
<script src="orb_motion.js"></script>
<script src="orb.js"></script>
<script src="reset.js"></script>
<script>
'use strict';
// Protocol v2 page: everything that can run here does (gate, wake word, STT, cues, telemetry); the server gets text,
// VAD edges, telemetry batches and (stt_route=server only) gated PCM.
const $ = id => document.getElementById(id);
const A = $('a');
const RIDE = 'ride-' + new Date().toISOString().replace(/[-:]/g, '').replace('T', '-').slice(0, 15);
let ws = null, wsOpen = false, helloSeen = false, tries = 0, replaced = false, cfg = {}, route = 'phone', engineName = 'transcript';
let linkEpoch = null, srvStt = null;     // AUD-R3-06: this link's epoch; the server's Scribe session state (server route)
const cueUrls = {};
function send(o) { if (wsOpen) try { ws.send(JSON.stringify(o)); } catch (e) {} }
// AUD-V2-10: every setup prerequisite has a deadline (ms; window.RIDE_SETUP_WAIT overrides, for tests). A hung
// Cache Storage / IndexedDB is skipped, a hung mic/worklet is a visible failure, and the wake engine is chosen from
// the server's hello.cfg (or, after `hello`, explicitly from the defaults). The audio unlock and the AudioContext
// resume are bounded too (fix round 2, R1): a pending play()/resume() is a visible failure with tap 1 again.
const WAIT = Object.assign({cache: 3000, idb: 2000, mic: 15000, worklet: 8000, hello: 5000, unlock: 4000, resume: 4000, revive: 1200, revive_tap: 2000},
                           window.RIDE_SETUP_WAIT || {});
// Round 3 (A3): the mic watchdog's timings. Missing frames for frames_ms, every track muted for muted_ms (h2: iOS mutes
// the track and silence keeps flowing), a revive ladder of 2/4/8 then every 10 s, and "I can't hear the mic" only after
// one revive attempt has finished and say_after_ms past the interruption. Tests override these small (RIDE_MIC_WAIT).
const MW = Object.assign({frames_ms: 3000, muted_ms: 3000, say_ms: 5000, say_after_ms: 2000, tick_ms: 1000,
                          ladder: [2000, 4000, 8000, 10000]}, window.RIDE_MIC_WAIT || {});
function deadline(p, ms, what) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(Object.assign(new Error(what + ' timeout'), {name: 'TimeoutError'})), ms);
    Promise.resolve(p).then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
  });
}
const helloWaiters = [];
function firstHello(ms) {
  if (helloSeen) return Promise.resolve(true);
  return deadline(new Promise(r => helloWaiters.push(r)), ms, 'hello').catch(() => false);
}

// ---- display: the orb (orb.js, WP5) on black; the status word only with show_word (debug, hello cfg.word)
let shown = '';
const orb = RideOrb({root: $('orb'), level: $('orbl'), motion: $('orbm')});
const clock = () => (typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now());
// P4: the orb moves with the bike (orb_motion.js). Gain from hello cfg.orb_motion (0 = off); reduced motion = off.
// gdown: iOS Safari's accelerometer vector points down at rest, the W3C one (Android) up.
const reducedMotion = () => { try { return typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const screenAngle = () => { const s = typeof screen !== 'undefined' && screen.orientation; return s && Number.isFinite(s.angle) ? s.angle : (typeof window.orientation === 'number' ? window.orientation : 0); };
const orbMotion = RideOrbMotion({gain: rideOrbMotionGain({}, reducedMotion()), gdown: !/Android/.test(navigator.userAgent || '')});
orb.setMotion(orbMotion);
function render() {
  const d = C.display();
  if (typeof gate !== 'undefined' && gate) gate.setSpeaking(d === 'speaking');
  if (d === shown) return;
  shown = d;
  orb.show(d);
  $('w').textContent = cfg.word === true ? d : '';
  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.metadata = new MediaMetadata({title: 'Hermes-Ride · ' + d, artist: 'Hermes-Ride'}); } catch (e) {}
  }
}

// ---- the one <audio> queue (client_state.js): cues and clips come from Cache Storage as blob URLs
const C = RideClient({
  audio: A,
  makeUrl: (bytes, mime) => URL.createObjectURL(new Blob([bytes], {type: mime})),
  revoke: u => URL.revokeObjectURL(u),
  cueUrl: p => cueUrls[p] || p,
  send, render, tone: g => onTone(g), toneStop: stopTone,
  cue: on => gate.hold(on),
  envelope: rideWavEnvelope,             // Fix F: the orb follows her voice (WAV segments)              // Fix A: our own cues and clips never reach Scribe or the wake spotter
});
function onTone(gain) { orb.tone(); playTone(gain); }   // a doo-doo tick: the thinking orb breathes with it (WP5)
// R3-4: the extended-work tone. Hermes Desktop's voice-mode thinking sound (apps/desktop/src/lib/thinking-sound.ts,
// mirrored by tools/voice_mode.py): a sine "blub" of 0.16 s, pitch gliding to x0.72, 20 ms attack, exponential decay,
// peak 0.08, pitches G4 392 Hz / E4 329.6 Hz. Here one tick is that pair ("doo, doo", 0.45 s apart) every 4-6 s
// (client_state.js), peak 0.16 x cue_gain (= Hermes's 0.08 at the default 0.5). It goes straight to the AudioContext,
// outside the <audio> queue, so it never delays a reply; stopTone() cuts a pair that is still sounding.
let toneBus = null;
function blub(freq, at, peak, out) {
  const t0 = ac.currentTime + 0.01 + at, dur = 0.16, osc = ac.createOscillator(), env = ac.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.72, t0 + dur);
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.exponentialRampToValueAtTime(peak, t0 + 0.02);
  env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(env); env.connect(out);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function playTone(gain) {
  const peak = 0.16 * gain;
  if (!ac || ac.state !== 'running' || !(peak > 0.0001)) return;
  stopTone();
  try {
    toneBus = ac.createGain(); toneBus.connect(ac.destination);
    blub(392, 0, peak, toneBus); blub(329.6, 0.45, peak, toneBus);
  } catch (e) { stopTone(); }
}
function stopTone() { if (toneBus) { try { toneBus.disconnect(); } catch (e) {} toneBus = null; } }
const cueBlobs = {}, cueGainOf = {};      // path -> the cached file; path -> the gain its cueUrls entry has
async function preload(paths) {          // tap 1: cues + clips into Cache Storage, then in-memory blob URLs
  let cache = null;
  try { cache = await caches.open('hermes-ride-cues-v5'); } catch (e) {}
  await Promise.all(paths.map(async p => {
    try {
      let r = cache && await cache.match(p);
      if (!r) { r = await fetch(p, {credentials: 'same-origin', cache: 'reload'}); if (!r.ok) return; if (cache) await cache.put(p, r.clone()); }
      const b = await r.blob();
      cueBlobs[p] = b; cueUrls[p] = URL.createObjectURL(b); cueGainOf[p] = 1;
    } catch (e) {}
  }));
  applyCueGain();
}
// R3-2: cues and clips at hello.cfg.cue_gain (default 0.5), the reply voice at full level. The cached files are decoded

// Any tap while the mic is dead is the gesture iOS wants: resume, unlock the idle <audio>, revive (round 3).

}
function gestureUnlock() {
  try { if (ac && ac.state !== 'running' && ac.state !== 'closed') Promise.resolve(ac.resume()).catch(() => {}); } catch (e) {}

function gestureRevive() {

// Fix B: the fallback when a revive got no frame: the Tap orb over everything (setup's look). Its click runs inside the
// gesture: resume the AudioContext, unlock <audio> (only if it is idle: never cut a cue or reply), then revive.
let tapShown = false;
function reviveTap(on) {

}
$('rvb').onclick = gestureRevive;
addEventListener('pageshow', () => micRevive('pageshow'));
// ---- R3-6: privacy. The indicator says what the mic is doing; 'off' only once every track has really ended.
// stopCapture() stops capture for good on this page: gate asleep, STT closed, worklet detached, track.stop() on every
// mic track; reload to restart. Round 3: nothing on the page calls it any more (the button and the lock screen pause /

function micState() {                   // AUD-R3-02: STT/gate activity first: 'off' never hides an open STT
  if (!micTracks.length) return '';

  micSrcs.forEach(n => { try { n.disconnect(); } catch (e) {} }); micSrcs = [];

}
// ---- Round 3 (A2; rider feedback: "mute used to work, the stop mic does not"): MUTE / UNMUTE, one tap on #mute (where the
// stop button was), or the lock screen / Control Centre pause or stop button. A soft, page-only state: gate asleep,
// pre-roll dropped, STT closed, no PCM batch kept; the worklet handler counts every frame (the mic watchdog stays quiet)
// and drops it before the wake spotter, the gate and the orb level; a late transcript, a wake-engine hit and the double
// tap are ignored; a reply that is playing keeps playing. Nothing leaves the phone. The mic tracks are never stopped or

let muted = false;
function paintMute() {

}
function setMuted(on) {

  // wait, and a MUTE pressed then must not be lost (the fresh worklet handler reads the flag)

  if (wakeEngine) try { wakeEngine.reset(); } catch (e) {}

}
// ---- Tap to wake (10 Nov): a double tap anywhere (gesture.js) wakes Lana exactly like "Hey Lana": wakeNow() below
// is the one wake path, the wake word's own. Only from sleep, or from the transcript engine's probe; awake, thinking
// or speaking it does nothing (it never cuts her off), and muted or after a hard stop it does nothing. The one mic
// control is the MUTE button. {t:'wake'} is unchanged (no protocol change), so turns.jsonl cannot tell a tap from a

function wakeNow(score) {
  C.wake(); gate.wake(); send({t: 'wake', w: wakeName(), score}); if (wakeEngine) wakeEngine.reset();
}
function tapWake() {

}
const dbl = RideDoubleTap({}, tapWake);
// ---- WP6 (D5, P6): reset (reset.js). Drag up from the grabber, hold the red bar 3 s: {t:'reset', epoch} once and a
// short cue; the server interrupts the turn, starts a new conversation (the gateway's /new) and resets its own state,
// then {t:'reset_done'} reloads the page (or 5 s pass without an answer: reload anyway; with the link down there is

const RWAIT = Object.assign({}, RIDE_RESET_DEFAULTS, window.RIDE_RESET_WAIT || {});
let resetSent = false, resetT = null, reloading = false;
function inside(node, id) {

const rst = RideReset(RWAIT, {
  isGrab: t => inside(t, 'grab'), isBar: t => inside(t, 'resetbar'),
  show: on => { $('rpanel').hidden = !on; $('reveal').classList.toggle('open', !!on); },

$('resetfill').style.transitionDuration = RWAIT.hold_ms + 'ms';
function resetNow() {
  resetSent = true;
  C.resetCue(true);
  try { sessionStorage.setItem('ride-reset', '1'); } catch (e) {}
  diag('resetting: the page reloads, then tap the orb again');
  if (wsOpen && linkEpoch) send({t: 'reset', epoch: linkEpoch});
  resetT = setTimeout(reloadPage, RWAIT.reload_ms);
}
function reloadPage() {
  if (reloading) return;
  reloading = true;
  if (resetT) { clearTimeout(resetT); resetT = null; }
  try { location.reload(); } catch (e) {}
}
function resetFailed(step) {
  if (resetT) { clearTimeout(resetT); resetT = null; }
  resetSent = false;
  try { sessionStorage.removeItem('ride-reset'); } catch (e) {}
  C.resetCue(false);

for (const k of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel']) {
  document.addEventListener(k, ev => {
    const e = {pointerId: ev.pointerId, x: ev.clientX, y: ev.clientY, target: ev.target,
               t: Number.isFinite(ev.timeStamp) ? ev.timeStamp : Date.now()};

function mediaSessionStop() {            // round 3: the lock screen / Control Centre pause and stop buttons MUTE
  if (!('mediaSession' in navigator)) return;      // (never a toggle: pressing twice stays muted; a reply keeps playing)
  for (const a of ['pause', 'stop']) {

setInterval(showMic, 1000);

// Round 3 (A3): the mic watchdog. Frames missing (or every track muted) while visible: revive on the 2/4/8/10 s ladder.

const tel = RideTelemetry(), outbox = RideOutbox();

let wl = null;
